<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0b0620">
<title>Volt Dash</title>
<style>
/* ---------- design tokens ---------- */
:root {
  --bg-0: #0b0620; --bg-1: #150c36; --bg-2: #211552; --bg-3: #2d1f6b;
  --ink: #fbf8ff; --muted: #c2b6ec; --dim: #8b7fbd;
  --cyan: #45f3ff; --pink: #ff4fd8; --cell: #ffd23f; --gem: #ff5ad1;
  --green: #3ddc84; --green-d: #13804a; --red: #ff4a5e; --orange: #ff9a2e; --violet: #8a5cff;
  --r-xl: 26px; --r-lg: 20px; --r-md: 15px; --r-sm: 11px;
  --card: linear-gradient(180deg, #2c2068 0%, #1f164e 100%);
  --card-edge: inset 0 1px 0 rgba(255, 255, 255, .14), inset 0 0 0 1px rgba(255, 255, 255, .05);
  --depth-1: 0 3px 0 #0c0628, 0 8px 18px rgba(4, 0, 18, .45);
  --depth-2: 0 5px 0 #0c0628, 0 14px 30px rgba(4, 0, 18, .55);
  --font: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --pad-t: max(env(safe-area-inset-top), 10px);
  --pad-r: max(env(safe-area-inset-right), 12px);
  --pad-b: max(env(safe-area-inset-bottom), 10px);
  --pad-l: max(env(safe-area-inset-left), 12px);
  --top-h: 60px;
  --nav-h: 66px;
}
* { box-sizing: border-box; }
html, body {
  margin: 0; height: 100%; overflow: hidden; background: var(--bg-0); color: var(--ink); font-family: var(--font);
  -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent;
  touch-action: none; overscroll-behavior: none; -webkit-touch-callout: none;
}
[hidden] { display: none !important; }
#game { position: fixed; inset: 0; }
#game canvas { display: block; width: 100%; height: 100%; touch-action: none; }
button { font: inherit; color: inherit; cursor: pointer; -webkit-tap-highlight-color: transparent; border: 0; background: none; padding: 0; }
button:focus { outline: none; }
button:focus-visible { outline: 3px solid #fff; outline-offset: 3px; }
.ic { display: inline-grid; place-items: center; width: 24px; height: 24px; flex: none; }
.ic svg { width: 100%; height: 100%; display: block; }
.num { font-variant-numeric: tabular-nums; }

/* ---------- buttons ---------- */
.btn {
  position: relative; display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  min-height: 48px; padding: 0 20px; border-radius: 16px; font-weight: 900; font-size: 16px; letter-spacing: .04em;
  text-transform: uppercase; color: #fff; background: linear-gradient(180deg, #7d6cff, #5a3df0);
  box-shadow: inset 0 2px 0 rgba(255, 255, 255, .35), inset 0 -4px 0 rgba(0, 0, 0, .22), 0 4px 0 #2a1690, 0 8px 16px rgba(0, 0, 0, .35);
  transition: transform .08s, box-shadow .08s, filter .15s; text-shadow: 0 1px 0 rgba(0, 0, 0, .3);
}
.btn:active { transform: translateY(3px) scale(.98); box-shadow: inset 0 2px 0 rgba(255, 255, 255, .3), inset 0 -2px 0 rgba(0, 0, 0, .2), 0 1px 0 #2a1690; }
.btn.green { background: linear-gradient(180deg, #5df59c, #22b866); color: #04321a; text-shadow: none;
  box-shadow: inset 0 2px 0 rgba(255, 255, 255, .5), inset 0 -4px 0 rgba(0, 0, 0, .15), 0 4px 0 var(--green-d), 0 8px 16px rgba(0, 0, 0, .35); }
.btn.gold { background: linear-gradient(180deg, #fff07a, #ffc531 50%, #ff961f); color: #3b1600; text-shadow: 0 1px 0 rgba(255, 255, 255, .4);
  box-shadow: inset 0 2px 0 rgba(255, 255, 255, .6), inset 0 -4px 0 rgba(0, 0, 0, .14), 0 4px 0 #a8480a, 0 8px 18px rgba(255, 150, 30, .3); }
.btn.ghost { background: rgba(255, 255, 255, .08); box-shadow: inset 0 0 0 2px rgba(255, 255, 255, .2); }
.btn.ghost:active { box-shadow: inset 0 0 0 2px rgba(255, 255, 255, .3); }
.btn.poor { filter: grayscale(.85) brightness(.75); }
.btn[disabled] { filter: grayscale(1) brightness(.6); pointer-events: none; }
.btn .ic { width: 20px; height: 20px; }
.btn.sm { min-height: 44px; padding: 0 14px; font-size: 15px; border-radius: 14px; }
.round-btn {
  display: grid; place-items: center; width: 46px; height: 46px; border-radius: 15px; flex: none;
  background: linear-gradient(180deg, #3a2b82, #251a5c); box-shadow: var(--card-edge), 0 3px 0 #0c0628;
}
.round-btn:active { transform: translateY(2px); box-shadow: var(--card-edge), 0 1px 0 #0c0628; }
.round-btn .ic { width: 24px; height: 24px; }
.shake { animation: shake .4s; }
@keyframes shake { 20%, 60% { transform: translateX(-7px); } 40%, 80% { transform: translateX(7px); } }
.pop-in { animation: popIn .45s cubic-bezier(.2, 1.6, .4, 1) both; }
@keyframes popIn { from { transform: scale(.6); opacity: 0; } to { transform: none; opacity: 1; } }
.bump { animation: bump .35s cubic-bezier(.2, 1.8, .4, 1); }
@keyframes bump { 40% { transform: scale(1.18); } }

/* ---------- menu shell ---------- */
.menu { position: fixed; inset: 0; display: flex; flex-direction: column; padding: var(--pad-t) var(--pad-r) 0 var(--pad-l); pointer-events: none; }
.menu > * { pointer-events: auto; }
.topbar { display: flex; align-items: center; gap: 8px; height: var(--top-h); position: relative; z-index: 3; }
.profile { display: flex; flex-direction: column; align-items: center; gap: 4px; flex: none; width: 50px; min-height: 54px; padding-top: 2px; }
.spacer { flex: 1; }
.avatar {
  position: relative; width: 46px; height: 46px; border-radius: 14px; flex: none; display: grid; place-items: center;
  background: radial-gradient(circle at 30% 25%, rgba(255, 255, 255, .7), rgba(255, 255, 255, 0) 45%), var(--av, #45f3ff); box-shadow: var(--card-edge), 0 3px 0 #0c0628;
}
.avatar > .ic { width: 30px; height: 30px; color: #160d3a; }
.avatar b {
  position: absolute; right: -6px; bottom: -6px; min-width: 24px; height: 24px; padding: 0 5px; border-radius: 12px; display: grid; place-items: center;
  font-size: 13px; font-weight: 900; color: #3b1600; background: linear-gradient(180deg, #fff07a, #ffb02e); box-shadow: 0 2px 0 #a8480a;
}
.xpbar { display: block; height: 8px; border-radius: 4px; background: rgba(255, 255, 255, .16); box-shadow: inset 0 0 0 1px rgba(255, 255, 255, .1); overflow: hidden; width: 46px; height: 6px; }
.xpbar i { display: block; height: 100%; width: 0; border-radius: 4px; background: linear-gradient(90deg, var(--cyan), #9dfcff); transition: width .6s; }
.pill {
  display: flex; align-items: center; gap: 5px; height: 44px; padding: 0 5px 0 7px; border-radius: 22px; flex: none;
  background: rgba(8, 3, 26, .72); box-shadow: inset 0 0 0 1.5px rgba(255, 255, 255, .14);
}
.pill .ic { width: 24px; height: 24px; }
.pill b { font-size: 15px; font-weight: 900; min-width: 28px; text-align: right; font-variant-numeric: tabular-nums; }
.pill .plus { display: grid; place-items: center; width: 30px; height: 30px; border-radius: 15px; background: linear-gradient(180deg, #5df59c, #22b866); color: #04321a; }
.pill .plus .ic { width: 14px; height: 14px; }
.pill.mini b { min-width: 20px; }

.pages { position: relative; flex: 1; min-height: 0; }
.page {
  position: absolute; inset: 0 0 calc(var(--nav-h) + var(--pad-b)) 0; display: flex; flex-direction: column;
  opacity: 0; transform: translateX(28px); pointer-events: none; transition: opacity .22s ease, transform .28s cubic-bezier(.2, .9, .3, 1); visibility: hidden;
}
.page.left { transform: translateX(-28px); }
.page.active { opacity: 1; transform: none; pointer-events: auto; visibility: visible; }
.page-title { display: flex; align-items: center; justify-content: space-between; margin: 6px 2px 10px; }
.page-title h2 { margin: 0; font-size: 28px; font-weight: 900; font-style: italic; letter-spacing: .01em; text-shadow: 0 3px 0 rgba(0, 0, 0, .35); }
.page-title .sub { color: var(--ink); font-size: 12px; font-weight: 900; padding: 6px 10px; border-radius: 12px; background: rgba(8, 3, 26, .65); }
.scroll { flex: 1; min-height: 0; overflow-y: auto; touch-action: pan-y; overscroll-behavior: contain; padding: 2px 2px 16px; -webkit-overflow-scrolling: touch; scrollbar-width: none; }
.scroll::-webkit-scrollbar { display: none; }
.solid-bg { background: linear-gradient(180deg, rgba(11, 6, 32, .86), rgba(11, 6, 32, .94)); margin: 0 calc(-1 * var(--pad-r)) 0 calc(-1 * var(--pad-l)); padding: 0 var(--pad-r) 0 var(--pad-l); }

/* ---------- home ---------- */
#page-home { align-items: center; }
.logo {
  margin: 4px 0 0; font-size: clamp(44px, 14vw, 64px); line-height: .84; font-weight: 900; font-style: italic; text-align: center;
  letter-spacing: -.02em; color: transparent; background: linear-gradient(180deg, #e8fdff, var(--cyan) 40%, var(--pink) 95%);
  -webkit-background-clip: text; background-clip: text; filter: drop-shadow(0 3px 0 #2a0e5a) drop-shadow(0 0 14px rgba(69, 243, 255, .4));
}
.logo-sub { margin: 6px 0 0; text-align: center; color: var(--muted); font-size: 11px; font-weight: 900; letter-spacing: .3em; text-transform: uppercase; }
.home-mid { flex: 1; width: 100%; position: relative; }
.home-side { position: absolute; top: 8px; display: flex; flex-direction: column; gap: 10px; }
.home-side.l { left: 0; } .home-side.r { right: 0; align-items: flex-end; }
.side-btn {
  position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; width: 62px; height: 62px; border-radius: 18px;
  background: var(--card); box-shadow: var(--card-edge), var(--depth-1); font-size: 10px; font-weight: 900; letter-spacing: .06em; text-transform: uppercase;
}
.side-btn .ic { width: 28px; height: 28px; color: var(--cyan); }
.side-btn:active { transform: translateY(2px); }
.chip {
  display: inline-flex; align-items: center; gap: 6px; height: 34px; padding: 0 12px; border-radius: 17px;
  background: rgba(8, 3, 26, .72); box-shadow: inset 0 0 0 1.5px rgba(255, 255, 255, .14); font-size: 13px; font-weight: 900; white-space: nowrap;
}
.chip .ic { width: 18px; height: 18px; }
.chip.gold { color: #ffe27a; }
.chip.violet { color: #d7c4ff; }
.badge-dot {
  position: absolute; top: -5px; right: -5px; min-width: 20px; height: 20px; padding: 0 5px; border-radius: 10px; display: grid; place-items: center;
  font-size: 11px; font-weight: 900; color: #fff; background: var(--red); box-shadow: 0 0 0 2.5px var(--bg-0); animation: pulse 1.4s infinite;
}
@keyframes pulse { 50% { transform: scale(1.15); } }
.home-foot { width: 100%; display: flex; flex-direction: column; align-items: center; gap: 10px; padding-bottom: 12px; }
.char-tag { display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 900; letter-spacing: .08em; text-transform: uppercase; }
.char-tag span { color: var(--muted); font-weight: 800; letter-spacing: .02em; text-transform: none; }
.play-btn {
  position: relative; width: min(84%, 320px); height: 76px; border-radius: 26px; font-size: 34px; font-weight: 900; font-style: italic; letter-spacing: .06em;
  color: #3b1600; background: linear-gradient(180deg, #fff59a 0%, #ffd23f 42%, #ff9a1f 100%);
  box-shadow: inset 0 3px 0 rgba(255, 255, 255, .75), inset 0 -7px 0 rgba(170, 60, 0, .35), 0 7px 0 #a8480a, 0 14px 28px rgba(0, 0, 0, .45), 0 0 40px rgba(255, 190, 50, .45);
  transition: transform .09s, box-shadow .09s; display: flex; align-items: center; justify-content: center; gap: 10px;
  text-shadow: 0 2px 0 rgba(255, 255, 255, .45); animation: breathe 2.4s ease-in-out infinite;
}
.play-btn .ic { width: 30px; height: 30px; }
.play-btn::after { content: ""; position: absolute; inset: 6px 14px auto; height: 22px; border-radius: 16px; background: linear-gradient(180deg, rgba(255, 255, 255, .55), rgba(255, 255, 255, 0)); pointer-events: none; }
.play-btn:active { animation: none; transform: translateY(5px) scale(.97, .93); box-shadow: inset 0 3px 0 rgba(255, 255, 255, .7), inset 0 -4px 0 rgba(170, 60, 0, .35), 0 2px 0 #a8480a, 0 0 30px rgba(255, 190, 50, .4); }
@keyframes breathe { 50% { transform: scale(1.035); } }

/* ---------- bottom nav ---------- */
.bottom-nav {
  position: absolute; left: 0; right: 0; bottom: 0; z-index: 3; display: flex; gap: 4px; height: calc(var(--nav-h) + var(--pad-b));
  padding: 6px calc(var(--pad-r) + 2px) var(--pad-b) calc(var(--pad-l) + 2px);
  background: linear-gradient(180deg, #221658, #120a33); box-shadow: inset 0 1px 0 rgba(255, 255, 255, .14), 0 -10px 30px rgba(0, 0, 0, .35);
  border-radius: 22px 22px 0 0;
}
.nav-btn {
  position: relative; flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; min-height: 52px; border-radius: 16px;
  color: var(--dim); font-size: 11px; font-weight: 900; letter-spacing: .05em; text-transform: uppercase; transition: color .2s, background .2s, transform .2s;
}
.nav-btn .ic { width: 26px; height: 26px; transition: transform .25s cubic-bezier(.2, 1.6, .4, 1); }
.nav-btn.active { color: #fff; background: linear-gradient(180deg, #4a37b8, #33248a); box-shadow: var(--card-edge), 0 3px 0 #0c0628; }
.nav-btn.active .ic { transform: translateY(-2px) scale(1.12); color: var(--cyan); }
.nav-btn .badge-dot { top: 2px; right: calc(50% - 26px); }

/* ---------- cards / lists ---------- */
.card { position: relative; border-radius: var(--r-lg); background: var(--card); box-shadow: var(--card-edge), var(--depth-1); }
.tabs { display: flex; gap: 6px; padding: 5px; border-radius: 16px; background: rgba(0, 0, 0, .35); box-shadow: inset 0 0 0 1px rgba(255, 255, 255, .08); margin-bottom: 12px; }
.tab { flex: 1; min-height: 44px; border-radius: 12px; font-weight: 900; font-size: 14px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); transition: background .2s, color .2s; }
.tab.active { color: #fff; background: linear-gradient(180deg, #6b58ff, #4a32d8); box-shadow: inset 0 1px 0 rgba(255, 255, 255, .3), 0 3px 0 #23137a; }
.list { display: flex; flex-direction: column; gap: 12px; }
.row-card { display: grid; grid-template-columns: 56px 1fr auto; align-items: center; gap: 12px; padding: 12px; }
.tile {
  position: relative; width: 56px; height: 56px; border-radius: 16px; display: grid; place-items: center; color: #fff;
  background: radial-gradient(circle at 35% 25%, rgba(255, 255, 255, .45), rgba(255, 255, 255, 0) 55%), var(--c, #6b58ff);
  box-shadow: inset 0 -4px 0 rgba(0, 0, 0, .25), 0 3px 0 rgba(0, 0, 0, .3);
}
.tile .ic { width: 32px; height: 32px; filter: drop-shadow(0 2px 0 rgba(0, 0, 0, .3)); }
.tile .count {
  position: absolute; right: -6px; top: -6px; min-width: 24px; height: 22px; padding: 0 6px; border-radius: 11px; display: grid; place-items: center;
  font-size: 12px; font-weight: 900; background: #fff; color: #1d1450; box-shadow: 0 2px 0 rgba(0, 0, 0, .3);
}
.rc-body { min-width: 0; }
.rc-body h3 { margin: 0; font-size: 16px; font-weight: 900; }
.rc-body p { margin: 3px 0 0; font-size: 12px; line-height: 1.3; color: var(--muted); }
.pips { display: flex; gap: 4px; margin-top: 7px; }
.pips i { width: 14px; height: 7px; border-radius: 3px; background: rgba(255, 255, 255, .14); }
.pips i.on { background: linear-gradient(180deg, #9dfcff, var(--cyan)); box-shadow: 0 0 6px rgba(69, 243, 255, .6); }
.stat-line { display: flex; align-items: center; gap: 5px; margin-top: 6px; font-size: 13px; font-weight: 900; color: #fff; }
.stat-line .arrow { color: var(--green); }
.stat-line .ic { width: 16px; height: 16px; color: var(--cyan); }
.price { display: inline-flex; align-items: center; gap: 4px; font-variant-numeric: tabular-nums; }
.price .ic { width: 20px; height: 20px; }
.rc-act { display: flex; flex-direction: column; gap: 6px; align-items: stretch; }
.rc-act .btn { min-width: 92px; }
.maxed { font-size: 12px; font-weight: 900; color: var(--green); letter-spacing: .1em; text-transform: uppercase; padding: 0 6px; }

/* ---------- characters ---------- */
.char-stage { position: relative; flex: 1; min-height: 150px; touch-action: none; }
.arrow-btn {
  position: absolute; top: 50%; transform: translateY(-50%); width: 48px; height: 64px; border-radius: 16px; display: grid; place-items: center;
  background: rgba(8, 3, 26, .55); box-shadow: inset 0 0 0 1.5px rgba(255, 255, 255, .16);
}
.arrow-btn:active { transform: translateY(-50%) scale(.92); }
.arrow-btn.l { left: 0; } .arrow-btn.r { right: 0; }
.char-dots { position: absolute; bottom: 4px; left: 0; right: 0; display: flex; justify-content: center; gap: 6px; }
.char-dots i { width: 8px; height: 8px; border-radius: 4px; background: rgba(255, 255, 255, .25); transition: width .2s, background .2s; }
.char-dots i.on { width: 22px; background: var(--cyan); }
.char-card { padding: 14px 14px 14px; display: flex; flex-direction: column; gap: 8px; }
.char-head { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
.char-head h3 { margin: 0; font-size: 26px; font-weight: 900; font-style: italic; }
.char-head span { color: var(--muted); font-size: 13px; font-weight: 800; }
.char-perk { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 14px; background: rgba(0, 0, 0, .28); font-size: 14px; font-weight: 800; }
.char-perk .ic { width: 22px; height: 22px; color: var(--cell); }
.char-perk small { display: block; color: var(--muted); font-size: 12px; font-weight: 700; margin-top: 2px; }
.char-lvl { display: flex; align-items: center; justify-content: space-between; font-size: 12px; font-weight: 900; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
.stars { display: flex; gap: 3px; }
.stars .ic { width: 18px; height: 18px; color: rgba(255, 255, 255, .18); }
.stars .ic.on { color: var(--cell); filter: drop-shadow(0 0 4px rgba(255, 210, 63, .6)); }
.char-actions { display: flex; gap: 8px; }
.char-actions .btn { flex: 1; padding: 0 10px; font-size: 15px; letter-spacing: .03em; gap: 6px; min-height: 52px; }

/* ---------- missions ---------- */
.tier-card { padding: 14px; display: flex; align-items: center; gap: 14px; margin-bottom: 12px; background: linear-gradient(135deg, #5a2fd0, #2a1a78 70%); }
.tier-num { width: 72px; height: 72px; flex: none; border-radius: 20px; display: grid; place-items: center; font-size: 30px; font-weight: 900; font-style: italic; color: #3b1600;
  background: linear-gradient(180deg, #fff07a, #ffb02e); box-shadow: inset 0 2px 0 rgba(255, 255, 255, .6), 0 4px 0 #a8480a; }
.tier-txt h3 { margin: 0; font-size: 17px; font-weight: 900; }
.tier-txt p { margin: 4px 0 8px; font-size: 12px; color: #e4dcff; line-height: 1.35; }
.m-card { padding: 12px; display: grid; grid-template-columns: 1fr auto; gap: 8px 10px; align-items: center; }
.m-card h4 { margin: 0; font-size: 15px; font-weight: 900; }
.m-card .bar { grid-column: 1; height: 12px; border-radius: 6px; background: rgba(0, 0, 0, .4); overflow: hidden; box-shadow: inset 0 0 0 1px rgba(255, 255, 255, .08); position: relative; }
.m-card .bar i { display: block; height: 100%; border-radius: 6px; background: linear-gradient(90deg, #6b58ff, var(--cyan)); transition: width .5s; }
.m-card.done .bar i { background: linear-gradient(90deg, #22b866, #7dffb4); }
.m-meta { display: flex; align-items: center; justify-content: space-between; font-size: 12px; font-weight: 800; color: var(--muted); grid-column: 1; }
.reward { display: inline-flex; align-items: center; gap: 4px; color: #fff; font-weight: 900; }
.reward .ic { width: 18px; height: 18px; }
.m-act { grid-column: 2; grid-row: 1 / span 3; }
.m-act .btn { min-width: 86px; }
.m-claimed { display: grid; place-items: center; width: 44px; height: 44px; border-radius: 22px; background: rgba(61, 220, 132, .18); color: var(--green); }
.daily-card { margin-top: 12px; padding: 12px; display: flex; align-items: center; gap: 12px; }
.daily-card .tile { --c: linear-gradient(180deg, #ff6aa8, #c2287a); }
.daily-card .rc-body { flex: 1; }

/* ---------- sheets ---------- */
.layer { position: fixed; inset: 0; z-index: 20; display: flex; flex-direction: column; justify-content: flex-end; }
.layer.center { justify-content: center; align-items: center; padding: var(--pad-t) var(--pad-r) var(--pad-b) var(--pad-l); }
.backdrop { position: absolute; inset: 0; background: rgba(5, 2, 18, .66); animation: fadeIn .2s both; }
@keyframes fadeIn { from { opacity: 0; } }
.sheet {
  position: relative; max-height: 88%; display: flex; flex-direction: column; border-radius: var(--r-xl) var(--r-xl) 0 0;
  background: linear-gradient(180deg, #2a1e66, #170f42); box-shadow: inset 0 1px 0 rgba(255, 255, 255, .18), 0 -20px 40px rgba(0, 0, 0, .4);
  padding: 8px calc(var(--pad-r) + 4px) calc(var(--pad-b) + 12px) calc(var(--pad-l) + 4px); animation: sheetUp .32s cubic-bezier(.2, 1, .3, 1) both;
}
.sheet::before { content: ""; display: block; width: 44px; height: 5px; border-radius: 3px; background: rgba(255, 255, 255, .25); margin: 0 auto 8px; }
@keyframes sheetUp { from { transform: translateY(100%); } }
.sheet-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
.sheet-head h2 { margin: 0; font-size: 24px; font-weight: 900; font-style: italic; }
.modal { position: relative; width: min(100%, 360px); padding: 20px 18px 18px; border-radius: var(--r-xl); text-align: center;
  background: linear-gradient(180deg, #2f2272, #1a1148); box-shadow: inset 0 1px 0 rgba(255, 255, 255, .2), var(--depth-2); animation: popIn .4s cubic-bezier(.2, 1.5, .4, 1) both; }
.modal h2 { margin: 0 0 6px; font-size: 28px; font-weight: 900; font-style: italic; }
.modal p { margin: 0 0 14px; color: var(--muted); font-size: 14px; line-height: 1.4; }
.modal .stack { display: flex; flex-direction: column; gap: 10px; }
.set-row { display: flex; align-items: center; gap: 12px; min-height: 56px; padding: 6px 4px; border-bottom: 1px solid rgba(255, 255, 255, .07); }
.set-row .ic { width: 26px; height: 26px; color: var(--cyan); }
.set-row label, .set-row .lbl { flex: 1; font-size: 16px; font-weight: 800; }
.switch { position: relative; width: 64px; height: 44px; border-radius: 22px; background: rgba(255, 255, 255, .14); transition: background .2s; flex: none; }
.switch::after { content: ""; position: absolute; top: 4px; left: 4px; width: 36px; height: 36px; border-radius: 18px; background: #fff; box-shadow: 0 2px 4px rgba(0, 0, 0, .35); transition: transform .22s cubic-bezier(.3, 1.5, .5, 1); }
.switch[aria-checked="true"] { background: linear-gradient(180deg, #5df59c, #22b866); }
.switch[aria-checked="true"]::after { transform: translateX(20px); }
.seg { display: flex; padding: 3px; border-radius: 13px; background: rgba(0, 0, 0, .35); }
.seg button { min-width: 64px; min-height: 44px; border-radius: 10px; font-weight: 900; font-size: 13px; text-transform: uppercase; color: var(--muted); }
.seg button.on { background: linear-gradient(180deg, #6b58ff, #4a32d8); color: #fff; }
.danger { color: #ffd0d6 !important; background: linear-gradient(180deg, #ff6a7a, #d22a45) !important; box-shadow: inset 0 2px 0 rgba(255, 255, 255, .35), 0 4px 0 #7a0f22 !important; }
.version { margin-top: 12px; text-align: center; color: var(--dim); font-size: 12px; font-weight: 700; }

/* loadout */
.lo-row { display: grid; grid-template-columns: 52px 1fr auto; gap: 12px; align-items: center; padding: 10px; margin-bottom: 10px; }
.lo-row .tile { width: 52px; height: 52px; }
.lo-row.off { opacity: .55; }
.lo-hint { text-align: center; font-size: 13px; color: var(--muted); margin: 2px 0 12px; }
.lo-hint button { color: var(--cyan); font-weight: 900; text-decoration: underline; min-height: 44px; padding: 0 6px; }

/* daily */
.daily-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-bottom: 14px; }
.day { position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; min-height: 86px; padding: 6px 2px; border-radius: 16px;
  background: rgba(0, 0, 0, .3); box-shadow: inset 0 0 0 1.5px rgba(255, 255, 255, .08); font-size: 11px; font-weight: 900; color: var(--muted); }
.day .ic { width: 30px; height: 30px; }
.day b { color: #fff; font-size: 14px; }
.day.big { grid-column: span 2; }
.day.got { opacity: .55; }
.day.got::after { content: "\2713"; position: absolute; top: 4px; right: 8px; color: var(--green); font-size: 16px; }
.day.today { background: linear-gradient(180deg, #6b58ff, #3a22b8); color: #fff; box-shadow: inset 0 0 0 2px #9dfcff, 0 0 18px rgba(69, 243, 255, .45); animation: pulse 1.6s infinite; }

/* mystery */
.box-art { width: 140px; height: 140px; margin: 8px auto 6px; position: relative; }
.box-art svg { width: 100%; height: 100%; overflow: visible; }
.box-art.shaking svg { animation: boxShake .12s infinite; }
@keyframes boxShake { 25% { transform: rotate(-6deg); } 75% { transform: rotate(6deg); } }
.box-art .lid { transform-origin: 70px 50px; transition: transform .45s cubic-bezier(.2, 1.5, .4, 1); }
.box-art.open .lid { transform: translateY(-34px) rotate(-18deg); }
.burst { position: absolute; inset: -30px; border-radius: 50%; background: radial-gradient(circle, rgba(255, 240, 150, .9), rgba(255, 120, 220, .4) 40%, rgba(255, 255, 255, 0) 70%); opacity: 0; transform: scale(.3); }
.box-art.open .burst { animation: burst .7s ease-out both; }
@keyframes burst { 30% { opacity: 1; } to { opacity: 0; transform: scale(1.4); } }
.prize { display: flex; align-items: center; justify-content: center; gap: 10px; font-size: 30px; font-weight: 900; margin: 6px 0 16px; }
.prize .ic { width: 40px; height: 40px; }

/* ---------- HUD ---------- */
#hud { position: fixed; inset: 0; pointer-events: none; padding: var(--pad-t) var(--pad-r) 0 var(--pad-l); }
#hud button { pointer-events: auto; }
.hud-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 8px; }
.hud-left { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.hud-score { display: flex; align-items: center; gap: 8px; }
.hud-score b { font-size: 34px; font-weight: 900; line-height: 1; font-variant-numeric: tabular-nums; text-shadow: 0 3px 0 rgba(0, 0, 0, .45), 0 0 14px rgba(69, 243, 255, .5); }
.mult-chip { padding: 3px 8px; border-radius: 10px; font-size: 14px; font-weight: 900; color: #3b1600; background: linear-gradient(180deg, #fff07a, #ffb02e); box-shadow: 0 2px 0 #a8480a; }
.hud-cur { display: flex; gap: 6px; }
.hud-cur > span { display: inline-flex; align-items: center; gap: 4px; height: 28px; padding: 0 9px 0 4px; border-radius: 14px; background: rgba(8, 3, 26, .55); font-size: 16px; font-weight: 900; font-variant-numeric: tabular-nums; }
.hud-cur .ic { width: 22px; height: 22px; }
.hud-right { display: flex; flex-direction: column; align-items: flex-end; gap: 8px; }
.hud-stage { display: flex; flex-direction: column; align-items: flex-end; gap: 5px; }
.stage-badge { padding: 4px 11px; border-radius: 11px; font-size: 12px; font-weight: 900; letter-spacing: .12em; text-transform: uppercase; background: rgba(8, 3, 26, .6); box-shadow: inset 0 0 0 1.5px rgba(255, 255, 255, .18); white-space: nowrap; }
.stage-bar { width: 86px; height: 7px; border-radius: 4px; background: rgba(0, 0, 0, .45); overflow: hidden; box-shadow: inset 0 0 0 1px rgba(255, 255, 255, .12); }
.stage-bar i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, var(--pink), var(--cyan)); }
.powers { display: flex; gap: 8px; margin-top: 10px; }
.pw { position: relative; width: 46px; height: 46px; border-radius: 50%; display: grid; place-items: center;
  background: conic-gradient(var(--c) calc(var(--p, 1) * 1turn), rgba(255, 255, 255, .15) 0); animation: popIn .3s both; }
.pw::before { content: ""; position: absolute; inset: 4px; border-radius: 50%; background: #1b1240; }
.pw .ic { position: relative; width: 24px; height: 24px; color: var(--c); }
.banner { position: absolute; left: 0; right: 0; top: 26%; text-align: center; animation: banner 2.6s cubic-bezier(.2, 1, .3, 1) both; }
.banner small { display: inline-block; padding: 5px 14px; border-radius: 12px; font-size: 15px; font-weight: 900; letter-spacing: .25em; text-transform: uppercase; color: #3b1600; background: linear-gradient(180deg, #fff07a, #ffb02e); box-shadow: 0 3px 0 #a8480a; }
.banner b { display: block; margin-top: 8px; font-size: clamp(30px, 10vw, 44px); font-weight: 900; font-style: italic; letter-spacing: .02em; line-height: 1;
  color: #fff; text-shadow: 0 4px 0 rgba(0, 0, 0, .45), 0 0 24px var(--bc, #45f3ff); }
@keyframes banner { 0% { opacity: 0; transform: scale(1.8) skewX(-12deg); } 14% { opacity: 1; transform: scale(1) skewX(-6deg); } 80% { opacity: 1; transform: scale(1) skewX(-6deg); } 100% { opacity: 0; transform: translateY(-30px) skewX(-6deg); } }
.tutorial { position: absolute; left: 0; right: 0; bottom: calc(var(--pad-b) + 90px); display: flex; flex-direction: column; align-items: center; gap: 8px; }
.tutorial .ic { width: 64px; height: 64px; color: #fff; filter: drop-shadow(0 0 12px var(--cyan)); animation: nudge 1s ease-in-out infinite; }
.tutorial b { padding: 8px 16px; border-radius: 14px; background: rgba(8, 3, 26, .7); font-size: 17px; font-weight: 900; }
@keyframes nudge { 50% { transform: scale(1.15); } }

/* ---------- overlays ---------- */
.overlay { position: fixed; inset: 0; z-index: 10; display: flex; align-items: center; justify-content: center; padding: var(--pad-t) var(--pad-r) var(--pad-b) var(--pad-l); background: rgba(6, 2, 22, .72); animation: fadeIn .2s both; }
.ring { position: relative; width: 120px; height: 120px; margin: 4px auto 14px; }
.ring svg { width: 100%; height: 100%; transform: rotate(-90deg); }
.ring circle { fill: none; stroke-width: 10; }
.ring .bg { stroke: rgba(255, 255, 255, .12); }
.ring .fg { stroke: var(--cyan); stroke-linecap: round; stroke-dasharray: 327; stroke-dashoffset: 0; }
.ring.go .fg { animation: drain 5s linear forwards; }
@keyframes drain { to { stroke-dashoffset: 327; } }
.ring b { position: absolute; inset: 0; display: grid; place-items: center; font-size: 44px; font-weight: 900; }
.link-btn { min-height: 44px; color: var(--muted); font-weight: 800; font-size: 15px; text-decoration: underline; }
.results { width: min(100%, 380px); max-height: 100%; overflow-y: auto; padding: 18px 16px 16px; scrollbar-width: none; }
.results h2 { margin: 0; font-size: 26px; }
.res-cause { margin: 4px 0 10px; font-size: 13px; color: var(--muted); }
.res-score { position: relative; margin: 0 0 12px; }
.res-score .label { display: block; color: var(--muted); font-size: 12px; font-weight: 900; letter-spacing: .3em; text-transform: uppercase; }
.res-score b { font-size: 56px; line-height: 1.05; font-weight: 900; font-variant-numeric: tabular-nums; text-shadow: 0 0 18px rgba(69, 243, 255, .5), 0 4px 0 rgba(0, 0, 0, .4); }
.ribbon { display: inline-block; margin-top: 2px; padding: 5px 18px; font-size: 13px; font-weight: 900; letter-spacing: .14em; color: #3b1600; text-transform: uppercase;
  background: linear-gradient(180deg, #fff07a, #ffb02e); clip-path: polygon(0 0, 100% 0, 94% 50%, 100% 100%, 0 100%, 6% 50%); animation: popIn .5s .2s both; }
.tally { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 12px; }
.tally > div { display: flex; align-items: center; gap: 8px; padding: 9px 10px; border-radius: 14px; background: rgba(0, 0, 0, .28); text-align: left; opacity: 0; animation: popIn .35s both; }
.tally .ic { width: 26px; height: 26px; color: var(--cyan); }
.tally span { display: block; font-size: 10px; font-weight: 900; letter-spacing: .14em; color: var(--muted); text-transform: uppercase; }
.tally b { font-size: 19px; font-weight: 900; font-variant-numeric: tabular-nums; }
.res-missions { display: flex; flex-direction: column; gap: 6px; margin-bottom: 14px; text-align: left; }
.res-m { display: grid; grid-template-columns: 1fr auto; gap: 4px 8px; font-size: 12px; font-weight: 800; color: var(--muted); }
.res-m .bar { grid-column: 1 / -1; height: 8px; border-radius: 4px; background: rgba(0, 0, 0, .4); overflow: hidden; }
.res-m .bar i { display: block; height: 100%; background: linear-gradient(90deg, #6b58ff, var(--cyan)); transition: width .8s; }
.res-m.done { color: var(--green); }
.res-m.done .bar i { background: var(--green); }
.res-btns { display: grid; grid-template-columns: 1fr 1.6fr; gap: 10px; }
.res-btns .btn { min-height: 58px; }

/* ---------- toasts + coin fly ---------- */
.toasts { position: fixed; left: 0; right: 0; top: calc(var(--pad-t) + 64px); z-index: 30; display: flex; flex-direction: column; align-items: center; gap: 8px; pointer-events: none; }
.toast { display: flex; align-items: center; gap: 10px; max-width: calc(100% - 32px); padding: 10px 16px 10px 10px; border-radius: 18px; font-size: 14px; font-weight: 900;
  background: linear-gradient(180deg, #3a2b8a, #241866); box-shadow: inset 0 1px 0 rgba(255, 255, 255, .2), var(--depth-2); animation: toastIn .4s cubic-bezier(.2, 1.5, .4, 1) both; }
.toast .tile { width: 36px; height: 36px; border-radius: 11px; }
.toast .tile .ic { width: 22px; height: 22px; }
.toast small { display: block; font-size: 12px; color: var(--muted); font-weight: 800; }
.toast.out { animation: toastOut .3s ease-in both; }
@keyframes toastIn { from { opacity: 0; transform: translateY(-20px) scale(.9); } }
@keyframes toastOut { to { opacity: 0; transform: translateY(-16px); } }
.fly { position: fixed; z-index: 40; width: 26px; height: 26px; pointer-events: none; margin: -13px 0 0 -13px; }
.fly svg { width: 100%; height: 100%; }
#fatal p { max-width: 320px; color: var(--muted); line-height: 1.5; }

@media (max-height: 700px) { :root { --nav-h: 60px; } .play-btn { height: 66px; font-size: 30px; } .logo { font-size: 42px; } }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; } }
</style>
</head>
<body>
<div id="game"></div>

<!-- Menu hub: top bar, four pages, bottom navigation. Filled by ui.js. -->
<div id="menu" class="menu" hidden>
  <header class="topbar">
    <button class="profile" id="btn-profile" aria-label="Account level">
      <span class="avatar" id="avatar"><span class="ic" data-icon="chars"></span><b id="lvl">1</b></span>
      <span class="xpbar"><i id="xp-fill"></i></span>
    </button>
    <span class="spacer"></span>
    <button class="pill" id="pill-cells" aria-label="Cells, open shop"><span class="ic" data-icon="cell"></span><b id="cur-cells">0</b><span class="plus"><span class="ic" data-icon="plus"></span></span></button>
    <button class="pill mini" id="pill-gems" aria-label="Gems, open shop"><span class="ic" data-icon="gem"></span><b id="cur-gems">0</b><span class="plus"><span class="ic" data-icon="plus"></span></span></button>
    <button class="round-btn" id="btn-settings" aria-label="Settings"><span class="ic" data-icon="gear"></span></button>
  </header>
  <main class="pages">
    <section class="page" id="page-home">
      <h1 class="logo">VOLT<br>DASH</h1>
      <p class="logo-sub">Neon courier run</p>
      <div class="home-mid">
        <div class="home-side l">
          <button class="side-btn" id="btn-daily" aria-label="Daily reward"><span class="ic" data-icon="calendar"></span>Daily<span class="badge-dot" id="daily-dot" hidden>!</span></button>
          <button class="side-btn" data-go="missions" aria-label="Missions"><span class="ic" data-icon="missions"></span>Goals</button>
        </div>
        <div class="home-side r">
          <span class="chip gold"><span class="ic" data-icon="trophy"></span><b id="home-best" class="num">0</b></span>
          <span class="chip violet">Score x<b id="home-mult" class="num">1</b></span>
        </div>
      </div>
      <div class="home-foot">
        <div class="char-tag" id="home-char">Volt <span>Courier Bot</span></div>
        <button id="btn-play" class="play-btn"><span class="ic" data-icon="play"></span>PLAY</button>
      </div>
    </section>

    <section class="page solid-bg" id="page-shop">
      <div class="page-title"><h2>Shop</h2></div>
      <div class="tabs" role="tablist">
        <button class="tab active" data-shop-tab="upgrades" role="tab">Upgrades</button>
        <button class="tab" data-shop-tab="items" role="tab">Items</button>
      </div>
      <div class="scroll"><div class="list" id="shop-list"></div></div>
    </section>

    <section class="page" id="page-chars">
      <div class="page-title"><h2>Characters</h2><span class="sub" id="char-count">1/6</span></div>
      <div class="char-stage" id="char-stage">
        <button class="arrow-btn l" id="char-prev" aria-label="Previous character"><span class="ic" data-icon="left"></span></button>
        <button class="arrow-btn r" id="char-next" aria-label="Next character"><span class="ic" data-icon="right"></span></button>
        <div class="char-dots" id="char-dots"></div>
      </div>
      <div class="card char-card" id="char-card"></div>
    </section>

    <section class="page solid-bg" id="page-missions">
      <div class="page-title"><h2>Missions</h2></div>
      <div class="scroll">
        <div class="card tier-card" id="tier-card"></div>
        <div class="list" id="mission-list"></div>
        <div class="card daily-card" id="daily-card"></div>
      </div>
    </section>
  </main>
  <nav class="bottom-nav" aria-label="Main">
    <button class="nav-btn active" data-tab="home"><span class="ic" data-icon="home"></span>Home</button>
    <button class="nav-btn" data-tab="shop"><span class="ic" data-icon="shop"></span>Shop<span class="badge-dot" data-badge="shop" hidden>!</span></button>
    <button class="nav-btn" data-tab="chars"><span class="ic" data-icon="chars"></span>Heroes<span class="badge-dot" data-badge="chars" hidden>!</span></button>
    <button class="nav-btn" data-tab="missions"><span class="ic" data-icon="missions"></span>Missions<span class="badge-dot" data-badge="missions" hidden>!</span></button>
  </nav>
</div>

<!-- In-run HUD -->
<div id="hud" hidden>
  <div class="hud-top">
    <div class="hud-left">
      <div class="hud-score"><b id="score">0</b><span class="mult-chip" id="hud-mult">x1</span></div>
      <div class="hud-cur"><span><span class="ic" data-icon="cell"></span><b id="cells">0</b></span><span><span class="ic" data-icon="gem"></span><b id="gems">0</b></span></div>
      <div class="powers" id="powers"></div>
    </div>
    <div class="hud-right">
      <button id="btn-pause" class="round-btn" aria-label="Pause"><span class="ic" data-icon="pause"></span></button>
      <div class="hud-stage"><span class="stage-badge" id="stage-badge">Stage 1</span><span class="stage-bar"><i id="stage-fill"></i></span></div>
    </div>
  </div>
  <div id="banner-slot"></div>
  <div id="tutorial" class="tutorial" hidden><span class="ic" id="tut-ic"></span><b id="tut-txt"></b></div>
</div>

<section id="pause" class="overlay" hidden>
  <div class="modal">
    <h2>Paused</h2>
    <p id="pause-stage">Stage 1</p>
    <div class="stack">
      <button id="btn-resume" class="btn gold"><span class="ic" data-icon="play"></span>Resume</button>
      <button class="btn ghost" data-open="settings"><span class="ic" data-icon="gear"></span>Settings</button>
      <button class="btn ghost" id="btn-quit"><span class="ic" data-icon="home"></span>End run</button>
    </div>
  </div>
</section>

<section id="revive" class="overlay" hidden>
  <div class="modal">
    <h2>Keep going?</h2>
    <p>Revive and continue this run.</p>
    <div class="ring" id="revive-ring"><svg viewBox="0 0 120 120"><circle class="bg" cx="60" cy="60" r="52"/><circle class="fg" cx="60" cy="60" r="52"/></svg><b id="revive-n">5</b></div>
    <div class="stack">
      <button id="btn-revive-token" class="btn green"><span class="ic" data-icon="revive"></span>Second Chance <span id="revive-tokens">x1</span></button>
      <button id="btn-revive-gems" class="btn"><span>Revive</span><span class="price"><span class="ic" data-icon="gem"></span><span id="revive-cost">1</span></span></button>
      <button id="btn-revive-skip" class="link-btn">No thanks</button>
    </div>
  </div>
</section>

<section id="over" class="overlay" hidden>
  <div class="modal results">
    <h2 id="over-title">Run complete</h2>
    <p id="over-cause" class="res-cause"></p>
    <div class="res-score"><span class="label">Score</span><b id="over-score">0</b><br><span id="over-badge" class="ribbon" hidden>New best!</span></div>
    <div class="tally" id="over-tally"></div>
    <div class="res-missions" id="over-missions"></div>
    <div class="res-btns">
      <button class="btn ghost" data-home><span class="ic" data-icon="home"></span>Home</button>
      <button id="btn-again" class="btn gold"><span class="ic" data-icon="play"></span>Play again</button>
    </div>
  </div>
</section>

<div id="layer-slot"></div>
<div class="toasts" id="toasts"></div>

<section id="fatal" class="overlay" hidden>
  <div class="modal"><h2>Can't start</h2><p id="fatal-msg"></p></div>
</section>

<!--BUNDLE-->
</body>
</html>
