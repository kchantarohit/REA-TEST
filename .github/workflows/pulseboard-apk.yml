name: Pulseboard APK

on:
  push:
    branches: [ccr-a58ccb84-lxi2xs]
    paths:
      - 'apps/pulseboard-android/**'
      - '.github/workflows/pulseboard-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/pulseboard-android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk Pulseboard-debug.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Pulseboard-debug
          path: apps/pulseboard-android/Pulseboard-debug.apk

      - name: Publish prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "pulseboard-${{ github.run_number }}" Pulseboard-debug.apk \
            --prerelease \
            --target ${{ github.sha }} \
            --title "Pulseboard build ${{ github.run_number }}" \
            --notes "Debug build"
